<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>古文単語試験対策</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Old+Mincho:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2ead9;
    --paper-deep:#e9dfc7;
    --ink:#454138;
    --ink-soft:#4a4235;
    --shu:#a3392a;
    --shu-deep:#7f2a1f;
    --ai:#33506e;
    --gold:#a3803f;
    --line:#c9b98f;
    --card:#faf5e8;
    --night:#1c1712;
    --night-card:#241f18;
    --vh:1vh;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%; overscroll-behavior:none;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Shippori Mincho','Zen Old Mincho',serif;
    line-height:1.9;
    overflow:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(74,66,53,0.025) 0px, rgba(74,66,53,0.025) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply;
    z-index:0;
  }
  button{font-family:inherit;}

  #app{ position:relative; width:100%; height:calc(var(--vh, 1vh) * 100); overflow:hidden; }

  .screen{
    position:absolute; inset:0;
    height:calc(var(--vh, 1vh) * 100);
    opacity:0;
    pointer-events:none;
    transform:translateY(14px) scale(.99);
    transition:opacity .55s cubic-bezier(.2,.7,.3,1), transform .55s cubic-bezier(.2,.7,.3,1);
    z-index:1;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0) scale(1);
    z-index:2;
  }

  /* ============ TITLE SCREEN ============ */
  #screen-title{
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(163,57,42,0.07), transparent 60%),
      var(--paper);
    cursor:pointer;
  }
  .title-stage{
    text-align:center;
    position:relative;
  }
  .title-frame{
    border:1.5px solid var(--gold);
    padding:clamp(20px,4vh,46px) clamp(18px,4vw,34px);
    position:relative;
    display:inline-block;
  }
  .title-frame::before, .title-frame::after{
    content:"";
    position:absolute;
    width:14px; height:14px;
    border:2px solid var(--shu);
  }
  .title-frame::before{ top:-8px; left:-8px; border-right:none; border-bottom:none; }
  .title-frame::after{ bottom:-8px; right:-8px; border-left:none; border-top:none; }
  .title-vertical{
    display:flex;
    flex-direction:row-reverse;
    align-items:flex-start;
    gap:clamp(0.4em, 3vw, 0.9em);
    margin:0;
  }
  .title-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(0.12em, 1.1vh, 0.28em);
  }
  .title-vertical .ch{
    display:block;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(1.5rem, 6.5vh, 2.7rem);
    line-height:1;
    color:var(--ink);
    opacity:0;
    filter:blur(4px);
    animation:chIn .6s ease forwards;
  }
  @keyframes chIn{
    to{ opacity:1; filter:blur(0); }
  }
  .tap-hint{
    margin:clamp(14px,3vh,26px) 0 0;
    font-size:0.78rem;
    letter-spacing:0.4em;
    color:var(--ink-soft);
    opacity:0;
    animation:hintIn 1s ease forwards 1.9s, blinkHint 2s ease-in-out infinite 2.9s;
  }
  @keyframes hintIn{ to{ opacity:0.85; } }
  @keyframes blinkHint{ 0%,100%{opacity:0.85;} 50%{opacity:0.25;} }

  /* ============ ROUND SELECT SCREEN ============ */
  #screen-rounds{
    background:var(--paper);
    display:flex; flex-direction:column;
    padding:0 22px;
  }
  .rounds-header{
    display:flex; align-items:center; gap:14px;
    padding:22px 2px 18px;
    border-bottom:2px double var(--gold);
    flex-shrink:0;
  }
  .rounds-header h2{
    font-size:1.15rem;
    letter-spacing:0.18em;
    margin:0;
    color:var(--ink);
    font-weight:600;
  }
  .nav-back{
    background:none; border:1px solid var(--ink-soft);
    color:var(--ink-soft);
    width:36px; height:36px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1rem;
    cursor:pointer;
    transition:transform .15s, border-color .15s, color .15s, background .15s;
    flex-shrink:0;
  }
  .nav-back:hover{ border-color:var(--shu); color:var(--shu-deep); }
  .nav-back:active{ transform:scale(.9); }

  .round-scroll{ flex:1; overflow-y:auto; padding:26px 2px 40px; }
  .round-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:14px;
  }
  .round-btn{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:clamp(12px,2.6vh,20px) 4px clamp(10px,2vh,16px);
    font-size:0.86rem;
    cursor:pointer;
    text-align:center;
    letter-spacing:0.02em;
    position:relative;
    overflow:hidden;
    opacity:0;
    transform:translateY(10px);
    animation:riseCard .45s ease forwards;
    transition:border-color .18s, transform .18s, box-shadow .18s;
  }
  @keyframes riseCard{ to{ opacity:1; transform:translateY(0); } }
  .round-btn:hover{ border-color:var(--shu); transform:translateY(-3px); box-shadow:0 8px 18px -10px rgba(36,32,25,.4); }
  .round-btn:active{ transform:translateY(0) scale(.95); }
  .round-btn .n{
    display:block;
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:1.25rem;
    letter-spacing:0.02em;
    white-space:nowrap;
    color:var(--shu);
    margin-bottom:4px;
  }
  .round-btn .cnt{
    display:block;
    font-size:0.68rem;
    white-space:nowrap;
    color:var(--ink-soft);
    opacity:.75;
  }
  .ripple{
    position:absolute; border-radius:50%;
    background:rgba(163,57,42,0.25);
    transform:scale(0);
    animation:rippleAnim .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{ transform:scale(3.4); opacity:0; } }

  @media (max-height:820px){
    .rounds-header{ padding:14px 2px 12px; }
    .round-scroll{ padding:16px 2px 24px; }
  }

  /* ============ WORD VIEWER SCREEN ============ */
  #screen-words{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(163,57,42,0.06), transparent 55%),
      var(--paper);
    color:var(--ink);
  }
  .words-chrome{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
    z-index:5;
    background:linear-gradient(to bottom, rgba(242,234,217,0.92), transparent);
  }
  .words-chrome .nav-back{ border-color:var(--ink-soft); color:var(--ink-soft); }
  .words-chrome .nav-back:hover{ border-color:var(--shu); color:var(--shu-deep); }
  .progress-label{
    font-size:0.72rem;
    letter-spacing:0.15em;
    color:var(--ink-soft);
  }
  .chrome-right{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .nav-list{
    background:var(--card);
    border:1px solid var(--gold);
    color:var(--shu-deep);
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.15em;
    padding:7px 14px;
    border-radius:3px;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s;
  }
  .nav-list:hover{ box-shadow:0 4px 12px -6px rgba(163,57,42,0.4); }
  .nav-list:active{ transform:scale(.94); }

  .list-overlay{
    position:absolute; inset:0;
    z-index:20;
    background:rgba(36,32,25,0.42);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .list-overlay.open{
    opacity:1;
    pointer-events:auto;
  }
  .list-panel{
    width:100%;
    max-width:640px;
    max-height:78%;
    background:var(--paper);
    border-top:3px double var(--gold);
    border-radius:14px 14px 0 0;
    box-shadow:0 -18px 40px -18px rgba(36,32,25,0.5);
    display:flex;
    flex-direction:column;
    transform:translateY(24px);
    transition:transform .35s cubic-bezier(.2,.8,.3,1);
  }
  .list-overlay.open .list-panel{ transform:translateY(0); }
  .list-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .list-panel-header h3{
    margin:0;
    font-size:1rem;
    letter-spacing:0.1em;
    color:var(--ink);
  }
  .list-panel-header .nav-back{ border-color:var(--ink-soft); color:var(--ink-soft); font-size:1.1rem; }
  .list-grid{
    overflow-y:auto;
    padding:16px 18px 28px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
    gap:10px;
  }
  .list-chip{
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--shu);
    padding:10px 12px;
    text-align:left;
    cursor:pointer;
    font-family:'Shippori Mincho',serif;
    transition:border-color .15s, transform .15s, background .15s;
  }
  .list-chip:hover{ border-color:var(--shu); transform:translateY(-2px); }
  .list-chip:active{ transform:translateY(0) scale(.97); }
  .list-chip.current{ background:rgba(163,57,42,0.1); border-left-color:var(--shu-deep); }
  .list-chip .li-idx{
    font-size:0.65rem;
    color:var(--ink-soft);
    letter-spacing:0.1em;
  }
  .list-chip .li-word{
    display:block;
    font-size:1rem;
    font-weight:700;
    color:var(--ink);
    margin:2px 0 3px;
  }
  .list-chip .li-mean{
    display:block;
    font-size:0.72rem;
    color:var(--ink-soft);
    line-height:1.5;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .progress-rail{
    position:absolute; top:0; bottom:0; right:6px;
    width:3px;
    background:rgba(74,66,53,0.12);
    z-index:5;
  }
  .progress-fill{
    position:absolute; top:0; left:0; right:0;
    height:0%;
    background:var(--shu);
    transition:height .35s ease;
  }

  .words-container{
    height:100%;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
  }
  .page{
    height:calc(var(--vh, 1vh) * 100);
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:70px 16px 40px;
    opacity:0.28;
    transform:scale(0.92);
    transition:opacity .5s ease, transform .5s ease;
  }
  .page.active{
    opacity:1;
    transform:scale(1);
  }
  .page::before{
    content:"";
    position:absolute; inset:14px;
    border:1px solid rgba(163,128,63,0.28);
    pointer-events:none;
  }
  .page-idx-mark{
    position:absolute;
    bottom:18px; left:50%;
    transform:translateX(-50%);
    font-size:0.68rem;
    letter-spacing:0.3em;
    color:var(--ink-soft);
  }

  .tate-flow{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    height:min(72vh, 560px);
    max-width:88vw;
    columns:1;
    column-width:168px;
    column-gap:30px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:4px 6px;
    scrollbar-width:thin;
  }
  .tate-flow::-webkit-scrollbar{ height:4px; }
  .tate-flow::-webkit-scrollbar-thumb{ background:rgba(201,187,153,0.25); }

  .tate-headword{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(2rem, 7vw, 2.9rem);
    margin:0 0 14px;
    color:var(--ink);
    line-height:1.25;
  }
  .tate-headword .ch{
    opacity:0;
    filter:blur(3px);
  }
  .page.active .tate-headword .ch{
    animation:chInWord .5s ease forwards;
  }
  @keyframes chInWord{
    to{ opacity:1; filter:blur(0); }
  }
  .tate-pos{
    display:inline-block;
    font-size:0.68rem;
    color:var(--ai);
    border:1px solid var(--ai);
    padding:2px 5px;
    margin:0 0 18px;
    border-radius:2px;
  }
  .tate-meaning{
    font-size:1.05rem;
    font-weight:700;
    color:var(--shu-deep);
    margin:0 0 22px;
    line-height:2;
  }
  .tate-block{
    font-size:0.86rem;
    color:var(--ink-soft);
    margin:0 0 22px;
    line-height:2.05;
    opacity:0;
    transform:translateY(8px);
  }
  .page.active .tate-block{
    animation:blockIn .6s ease forwards;
  }
  .tate-block .tag{
    display:inline-block;
    font-size:0.68rem;
    letter-spacing:0.1em;
    color:var(--gold);
    border-bottom:1px solid var(--gold);
    margin-bottom:8px;
    padding-bottom:2px;
  }
  .tate-block.mne .tag{ color:var(--ai); border-color:var(--ai); }
  .tate-block.ex .tag{ color:var(--shu); border-color:var(--shu); }
  .tate-block .ex-text{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:0.98rem;
    color:var(--ink);
    margin:0 0 6px;
  }
  .tate-block .ex-trans{ font-size:0.78rem; color:var(--ink-soft); margin:0; }
  .tate-block .ex-src{
    display:inline-block;
    margin-top:8px;
    font-size:0.64rem;
    color:var(--shu-deep);
    border:1px solid var(--shu);
    padding:1px 6px;
    border-radius:2px;
  }
  @keyframes blockIn{ to{ opacity:1; transform:translateY(0); } }

  .scroll-cue{
    position:absolute;
    bottom:16px; right:22px;
    writing-mode:vertical-rl;
    font-size:0.65rem;
    letter-spacing:0.3em;
    color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
    animation:cueBounce 1.8s ease-in-out infinite;
  }
  @keyframes cueBounce{
    0%,100%{ transform:translateY(0); opacity:.7; }
    50%{ transform:translateY(6px); opacity:1; }
  }

  @media (max-height:820px){
    .page{ padding:56px 16px 30px; }
    .tate-flow{ height:min(68vh, 470px); }
    .tate-headword{ font-size:clamp(1.6rem, 6vw, 2.3rem); margin-bottom:10px; }
    .tate-meaning{ margin-bottom:16px; }
    .tate-block{ margin-bottom:16px; font-size:0.8rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- TITLE SCREEN -->
  <section id="screen-title" class="screen active">
    <div class="title-stage">
      <div class="title-frame">
        <h1 class="title-vertical" id="titleText"></h1>
      </div>
      <p class="tap-hint">タップして はじめる</p>
    </div>
  </section>

  <!-- ROUND SELECT SCREEN -->
  <section id="screen-rounds" class="screen">
    <div class="rounds-header">
      <button class="nav-back" id="backToTitle">◁</button>
      <h2>回 を 選 ぶ</h2>
    </div>
    <div class="round-scroll">
      <div class="round-grid" id="roundGrid"></div>
    </div>
  </section>

  <!-- WORD VIEWER SCREEN -->
  <section id="screen-words" class="screen">
    <div class="words-chrome">
      <button class="nav-back" id="backToRounds">◁</button>
      <div class="chrome-right">
        <div class="progress-label" id="progressLabel"></div>
        <button class="nav-list" id="openList">目次</button>
      </div>
    </div>
    <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
    <div class="words-container" id="wordsContainer"></div>

    <div class="list-overlay" id="listOverlay">
      <div class="list-panel">
        <div class="list-panel-header">
          <h3 id="listPanelTitle"></h3>
          <button class="nav-back" id="closeList">×</button>
        </div>
        <div class="list-grid" id="listGrid"></div>
      </div>
    </div>
  </section>

</div>

<script>
const ROUNDS = [
{id:1, words:[
 {w:"あいなし", pos:"形", mean:"つまらない／気にくわない／わけもなく", expl:"「愛（あい）」＋「無し」から、相手に愛着や好感が持てない気持ちを表し、そこから広く「おもしろくない・不都合だ」の意に発展した語。", mne:"「愛（あい）」が「無し」＝愛情が湧かない→つまらない、と丸ごと覚える。", ex:{t:"いふもあいなし。",tr:"言うのもつまらない。"}},
 {w:"あからさまなり", pos:"形動", mean:"①急だ・突然だ　②かりそめだ・一時的だ", expl:"現代語の『あからさま（露骨）』とは意味が異なる要注意語。光がぱっと差してすぐ消えるイメージで、物事の一時性・突発性を表す。", mne:"「明るい」がパッと差してすぐ消える→『一瞬だけ・急に』と結びつける。", ex:{t:"あからさまに立ち出でて、すなはち帰りぬ。",tr:"ちょっとの間だけ外に出て、すぐに帰った。"}},
 {w:"あく", pos:"動（下二段）", mean:"飽きる・いやになる", expl:"現代語の『飽きる』とほぼ同じ意味で使われる、古文の中では素直な語。", mne:"読み方も意味も現代語とほぼ同じなのでそのまま覚えてよい。", ex:{t:"見るにあきぬ心地す。",tr:"見ていて飽きない気持ちがする。"}},
 {w:"あさまし", pos:"形", mean:"驚きあきれるほどだ・（程度が）ひどい・情けない", expl:"良い意味にも悪い意味にも使え、とにかく『驚きの度合いが甚だしい』ことを表す評価語。", mne:"現代語『あさましい』（見苦しい）よりもまず『驚きあきれる』の意味を先に思い出す。", ex:{t:"あさましきまで泣きたまふ。",tr:"あきれるほどひどくお泣きになる。"}},
 {w:"あした", pos:"名", mean:"朝", expl:"現代語『明日』とは異なり、古文では単に『朝』を意味する最頻出の同音異義語。対義語は『ゆふべ（夕方）』。", mne:"『あした』と『ゆふべ』はセットで『朝と夕方』のペアとして覚える。", ex:{t:"あしたに見れば、露なほ置きたり。",tr:"朝に見ると、露がまだ置いていた。"}},
 {w:"あそび", pos:"名", mean:"管弦の遊び・詩歌管弦の催し／遊興", expl:"現代語の『遊び』よりも、和歌・管弦・詩歌などを楽しむ風雅な催しを指すことが多い。", mne:"『あそび』はまず子供の遊びではなく『管弦の遊び（音楽会）』と思い出す。", ex:{t:"月の夜、御あそびあり。",tr:"月の美しい夜に、管弦の催しがあった。"}},
 {w:"あだなり", pos:"形動", mean:"不誠実だ・浮気っぽい・はかない・むだだ", expl:"漢字を当てると『徒なり』。実（じつ）がなく、誠実さや実りに欠ける様子を表し、恋愛関係の移り気にもよく使われる。", mne:"『あだ』＝『徒（あだ）』＝無駄・実りなし、とイメージする。", ex:{t:"あだなる契りをば頼まじ。",tr:"不誠実な約束を頼りにはすまい。"}},
 {w:"あたらし", pos:"形", mean:"惜しい・もったいない", expl:"現代語『新しい』とはまったく別の語で、入試最頻出の紛らわしい語。『あたら（惜）』が語源。", mne:"『新しい』と混同しないよう、『あたら＝惜しい』とセットで唱えて覚える。", ex:{t:"あたらしき人を失ひつるかな。",tr:"惜しい人を失ってしまったことよ。"}},
 {w:"あぢきなし", pos:"形", mean:"どうにもならない・つまらない・道理に合わない", expl:"物事が思うようにいかず、どうしようもない空しさや不快感を表す語。", mne:"現代語『味気ない』のニュアンスに重ねて『どうにもならない』を覚える。", ex:{t:"あぢきなき世なりけり。",tr:"どうにもならない世の中であったよ。"}},

 {w:"あない", pos:"名", mean:"案内・取り次ぎ・様子", expl:"現代語の『案内』に近いが、来訪を取り次いでもらう動作そのものを指すことも多い。", mne:"現代語とほぼ同じ意味なので、漢字『案内』をそのまま当てて覚える。", ex:{t:"あないせさせて入りたまふ。",tr:"取り次ぎをさせてお入りになる。"}},
 {w:"あながちなり", pos:"形動", mean:"無理やりだ・ひたすらだ・強引だ", expl:"下に打消を伴うと『必ずしも～ない』という訳になる重要語。", mne:"『強ち（あながち）』＝無理に、下に『ず』があれば『必ずしも～ない』と変換する。", ex:{t:"あながちに恋ひわたる。",tr:"ひたすらに恋い慕い続ける。"}},
 {w:"あなかま", pos:"感動詞", mean:"ああ、やかましい・静かにしなさい", expl:"『あな（ああ）』＋『かまし（やかましい）』の略で、人を制止するときに発する言葉。", mne:"『あな（ああ）』＋『かまし』→『静かに！』と一語で叫ぶ場面を想像する。", ex:{t:"あなかま、人聞かむ。",tr:"ああ、静かに。人に聞かれてしまう。"}},
 {w:"あはれなり", pos:"形動", mean:"しみじみと趣深い・かわいそうだ・愛情深い", expl:"心にしみじみと迫る感動全般を表す、日本文学の美意識の中核をなす最重要語。", mne:"感動詞『あはれ（ああ）』から発展した語で、『しみじみ感じる』が基本イメージ。", ex:{t:"三つ四つ、二つ三つなど飛び急ぐさへあはれなり。",tr:"（烏が）三つ四つ、二つ三つと飛び急ぐ様子までもがしみじみと趣深い。",s:"枕草子（第一段・秋）"}},
 {w:"あふ", pos:"動（四段）", mean:"結婚する・男女が深い関係を結ぶ", expl:"単なる面会ではなく、男女が契りを結ぶ意味で使われることが多い点に注意。", mne:"『あふ』は『ただ会う』ではなく『結ばれる』と一段深く訳す癖をつける。", ex:{t:"あひ見むことはいと難くやあるべき。",tr:"お逢いすることはとても難しいのだろうか。"}},
]},
{id:2, words:[

]},

 {w:"おはす", pos:"動", mean:"いらっしゃる（尊敬）", expl:"『あり・をり・行く・来』の尊敬語として幅広く使われる最重要敬語動詞。", mne:"『おはす』は『いる・行く・来る』何でも『いらっしゃる』と訳す万能敬語。", ex:{t:"宮おはします。",tr:"宮様がいらっしゃる。"}},
 {w:"おぼえ", pos:"名", mean:"評判・寵愛・記憶", expl:"人からどう思われているか、特に主君からの寵愛の程度を表すことが多い。", mne:"『覚え』＝『人からの覚え（評価）がよい』という現代語の言い回しから覚える。", ex:{t:"おぼえめでたき人なり。",tr:"（主君からの）評判のすばらしい人である。"}},
 {w:"おぼす", pos:"動（四段）", mean:"お思いになる（尊敬）", expl:"『思ふ』の尊敬語で、貴人の心中を敬って表す最重要敬語動詞の一つ。", mne:"『思ふ』の尊敬語として『思ふ→おぼす』と対応させて覚える。", ex:{t:"いかにおぼすらむ。",tr:"どのようにお思いだろうか。"}},
 {w:"おぼつかなし", pos:"形", mean:"はっきりしない・気がかりだ・待ち遠しい", expl:"物事の正体や先行きが不明瞭で、不安や焦れったさを感じる様子を表す。", mne:"現代語『おぼつかない（足取りがあやふや）』のイメージから『不明瞭・不安』を覚える。", ex:{t:"行方おぼつかなし。",tr:"行方がはっきりしなくて気がかりだ。"}},
 {w:"おほとのごもる", pos:"動", mean:"お休みになる（尊敬）", expl:"貴人が眠る・休むことを表す最高敬語の一つ。", mne:"『大殿（おほとの）ごもる』＝殿でお休みになる、と漢字イメージで覚える。", ex:{t:"はやくおほとのごもりぬ。",tr:"早くお休みになった。"}},
 {w:"おぼゆ", pos:"動（下二段）", mean:"思われる・感じられる・似る", expl:"自発の意味が中心で、自然にそう感じられる・思い出されることを表す。", mne:"『おぼゆ』＝『覚（おぼ）ゆ』＝自然と心に浮かぶ、と自発の意味で覚える。", ex:{t:"昔のことおぼえて涙ぐむ。",tr:"昔のことが自然と思い出されて涙ぐむ。"}},
 {w:"おもしろし", pos:"形", mean:"趣がある・風情がある・楽しい", expl:"現代語の『笑える』ではなく、景色や物事に心惹かれる趣深さを表す。", mne:"『面（おも）＋白し』＝目の前がぱっと明るく感じる趣深さ、とイメージする。", ex:{t:"おもしろき月の夜なりけり。",tr:"趣深い月夜であったよ。"}},
 {w:"おもておこし", pos:"名", mean:"面目が立つこと・名誉を得ること", expl:"体面・評判が良い方向に立つことを表す。", mne:"『面（顔）』を『起こす』＝顔が立つ＝面目が立つ、と覚える。", ex:{t:"おもておこしなる出世をす。",tr:"面目の立つ出世をする。"}},

]},
{id:6, words:[

 {w:"かくる", pos:"動（下二段）", mean:"隠れる・（貴人が）お亡くなりになる", expl:"姿を隠すことから転じて、高貴な人の死を婉曲に表す表現になる。", mne:"『隠（かく）る』＝この世から姿を隠す＝亡くなる、と婉曲表現として覚える。", ex:{t:"はかなくかくれたまひぬ。",tr:"あっけなくお亡くなりになった。"}},

]},

]},

 {w:"なほ", pos:"副", mean:"やはり・依然として／さらに", expl:"以前の状態が変わらず続くこと、また程度が一層増すことを表す。", mne:"現代語『なお』とほぼ同じ、『やはり・さらに』で直感的に覚える。", ex:{t:"なほ思ひまさる。",tr:"やはり思いがまさる。"}},
 {w:"なまめかし", pos:"形", mean:"優美だ・若々しく上品だ・色っぽい", expl:"みずみずしい若さと気品を兼ね備えた美しさを表す。", mne:"『生（なま）めかし』＝生き生きとした若々しさ、と覚える。", ex:{t:"なまめかしき姿なり。",tr:"若々しく優美な姿である。"}},
 {w:"なむ", pos:"係助詞", mean:"（強意・強調、係り結びで連体形）", expl:"文中の語を強く指し示す係助詞で、文末は連体形で結ぶ。", mne:"『ぞ・なむ・や・か』は連体形で結ぶ係助詞のグループ、とまとめて覚える。", ex:{t:"花なむ咲きたる。",tr:"花が咲いているのだ。"}},
 {w:"なやむ", pos:"動（四段）", mean:"病気で苦しむ・患う", expl:"現代語の『悩む（思い悩む）』よりも、病に苦しむ意味が古文では中心。", mne:"まず『病気で苦しむ』を第一義として覚える。", ex:{t:"風邪になやむ。",tr:"風邪で苦しむ。"}},
]},
{id:13, words:[

 {w:"はしたなし", pos:"形", mean:"きまりが悪い・中途半端だ・そっけない", expl:"どっちつかずで落ち着かない、居心地の悪い気まずさを表す。", mne:"『端（はした）』＝中途半端な端数、と考え『きまりが悪い』を導く。", ex:{t:"はしたなき心地す。",tr:"きまりの悪い気持ちがする。"}},

 {w:"はやく", pos:"副", mean:"以前に・かつて／なんと～だったのだなあ（気づき）", expl:"過去の出来事を指すほか、後に気づいた事実に対する感慨を表すこともある。", mne:"『早く』が『以前に』の意味になる古語用法、と現代語とのズレを意識する。", ex:{t:"はやく亡くなりにけり。",tr:"実は以前に亡くなっていたのだった。"}},
 {w:"はべり", pos:"動（ラ変）", mean:"お仕えする（謙譲）／あります・ございます（丁寧）", expl:"『あり・をり』の丁寧語・謙譲語として非常に多用される最重要敬語動詞。", mne:"『侍（はべ）り』＝おそばに控える→丁寧に『あります』、と『さぶらふ』と同じ仲間で覚える。", ex:{t:"かくなむはべる。",tr:"このようでございます。"}},
 {w:"ひがごと", pos:"名", mean:"間違ったこと・道理に外れたこと", expl:"『僻（ひが）事』の字を当て、正しくない、ひねくれたことを指す。", mne:"『僻（ひが）む』の『僻』＝ひねくれ＝間違い、と漢字から覚える。", ex:{t:"ひがごとを言ふ。",tr:"見当違いなことを言う。"}},

]},
{id:14, words:[

]},

/* ---------- viewport height fix (mobile browser chrome) ---------- */
function setVH(){
  document.documentElement.style.setProperty('--vh', (window.innerHeight*0.01)+'px');
}
setVH();
window.addEventListener('resize', setVH);

/* ---------- screen management ---------- */
const screens = {
  title: document.getElementById('screen-title'),
  rounds: document.getElementById('screen-rounds'),
  words: document.getElementById('screen-words'),
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* ---------- title screen: character reveal ---------- */
const TITLE_TEXT = '古文単語試験対策';
const titleEl = document.getElementById('titleText');
const CHUNK = 4;
let globalIdx = 0;
for(let start=0; start<TITLE_TEXT.length; start+=CHUNK){
  const col = document.createElement('div');
  col.className = 'title-col';
  [...TITLE_TEXT.slice(start, start+CHUNK)].forEach(ch=>{
    const span = document.createElement('span');
    span.className = 'ch';
    span.textContent = ch;
    span.style.animationDelay = (0.55 + globalIdx*0.09) + 's';
    col.appendChild(span);
    globalIdx++;
  });
  titleEl.appendChild(col);
}
screens.title.addEventListener('click', ()=>{
  showScreen('rounds');
});

/* ---------- round select screen ---------- */
const roundGrid = document.getElementById('roundGrid');
function buildRoundGrid(){
  ROUNDS.forEach((r,i)=>{
    const btn = document.createElement('button');
    btn.className = 'round-btn';
    btn.style.animationDelay = (i*0.03)+'s';
    btn.innerHTML = '<span class="n">第'+numToKanji(r.id)+'回</span><span class="cnt">'+r.words.length+'語</span>';
    btn.addEventListener('click',(e)=>{
      spawnRipple(btn, e);
      openRound(r.id);
    });
    roundGrid.appendChild(btn);
  });
}
document.getElementById('backToTitle').addEventListener('click', ()=> showScreen('title'));

function spawnRipple(btn, e){
  const rect = btn.getBoundingClientRect();
  const r = document.createElement('span');
  r.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  r.style.width = r.style.height = size + 'px';
  const x = (e.clientX ?? rect.left+rect.width/2) - rect.left - size/2;
  const y = (e.clientY ?? rect.top+rect.height/2) - rect.top - size/2;
  r.style.left = x + 'px';
  r.style.top = y + 'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 600);
}

function numToKanji(n){
  const d = ['','一','二','三','四','五','六','七','八','九'];
  if(n<10) return d[n];
  if(n===10) return '十';
  if(n<20) return '十'+d[n-10];
  return String(n);
}

  round.words.forEach((w,i)=>{
    const page = document.createElement('section');
    page.className = 'page';
    page.dataset.index = i;

    const headSpans = [...w.w].map((ch,ci)=>'<span class="ch" style="animation-delay:'+(ci*0.07)+'s">'+ch+'</span>').join('');

    const exBlock = w.ex ? (
      '<div class="tate-block ex">'
      + '<span class="tag">例文</span><br>'
      + '<span class="ex-text">'+w.ex.t+'</span><br>'
      + '<span class="ex-trans">'+w.ex.tr+'</span>'
      + (w.ex.s ? '<br><span class="ex-src">'+w.ex.s+'</span>' : '')
      + '</div>'
    ) : '';

    page.innerHTML =
      '<div class="tate-flow">'
      + '<h2 class="tate-headword">'+headSpans+'</h2>'
      + '<span class="tate-pos">'+w.pos+'</span>'
      + '<p class="tate-meaning">'+w.mean+'</p>'
      + '<div class="tate-block expl" style="animation-delay:.15s"><span class="tag">解説</span><br>'+w.expl+'</div>'
      + '<div class="tate-block mne" style="animation-delay:.3s"><span class="tag">覚え方</span><br>'+w.mne+'</div>'
      + (exBlock ? exBlock.replace('class="tate-block ex"','class="tate-block ex" style="animation-delay:.45s"') : '')
      + '</div>'
      + '<div class="page-idx-mark">第'+numToKanji(round.id)+'回 ・ '+(i+1)+' / '+round.words.length+'</div>'
      + (i < round.words.length-1 ? '<div class="scroll-cue">つぎへ ▽</div>' : '<div class="scroll-cue">これで おわり</div>');

    wordsContainer.appendChild(page);
  });

  showScreen('words');
  wordsContainer.scrollTop = 0;
  currentIndex = 0;
  updateProgress(round, 0);
  setupObserver(round);
  buildListGrid(round, 0);
}

function jumpToWord(idx){
  const pages = wordsContainer.querySelectorAll('.page');
  if(pages[idx]){
    pages[idx].scrollIntoView({behavior:'smooth', block:'start'});
  }
  closeList();
}

function buildListGrid(round, activeIdx){
  listPanelTitle.textContent = '第'+numToKanji(round.id)+'回 の 単語 一覧';
  listGrid.innerHTML = '';
  round.words.forEach((w,i)=>{
    const chip = document.createElement('button');
    chip.className = 'list-chip' + (i===activeIdx ? ' current' : '');
    chip.dataset.idx = i;
    chip.innerHTML =
      '<span class="li-idx">'+String(i+1).padStart(2,'0')+'</span>'
      + '<span class="li-word">'+w.w+'</span>'
      + '<span class="li-mean">'+w.mean+'</span>';
    chip.addEventListener('click', ()=> jumpToWord(i));
    listGrid.appendChild(chip);
  });
}

document.getElementById('openList').addEventListener('click', ()=>{
  if(!currentRoundData) return;
  buildListGrid(currentRoundData, currentIndex);
  listOverlay.classList.add('open');
});
document.getElementById('closeList').addEventListener('click', closeList);
listOverlay.addEventListener('click', (e)=>{
  if(e.target === listOverlay) closeList();
});
function closeList(){
  listOverlay.classList.remove('open');
}

function updateProgress(round, i){
  currentIndex = i;
  progressLabel.textContent = '第'+numToKanji(round.id)+'回 ・ '+(i+1)+' / '+round.words.length;
  progressFill.style.height = (((i+1)/round.words.length)*100)+'%';
}

function setupObserver(round){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && entry.intersectionRatio > 0.55){
        entry.target.classList.add('active');
        const idx = Number(entry.target.dataset.index);
        updateProgress(round, idx);
      } else {
        entry.target.classList.remove('active');
      }
    });
  }, { root: wordsContainer, threshold: [0, 0.55, 1] });

  document.querySelectorAll('.page').forEach(p=>observer.observe(p));
}

/* ---------- init ---------- */
buildRoundGrid();
</script>

<style id="kobun-patch">
/* 非表示の画面・目次にフォーカスが入らないように */
.screen{visibility:hidden;transition:opacity .55s cubic-bezier(.2,.7,.3,1),transform .55s cubic-bezier(.2,.7,.3,1),visibility 0s linear .55s}
.screen.active{visibility:visible;transition-delay:0s}
.list-overlay{visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.list-overlay.open{visibility:visible;transition-delay:0s}

/* 回の選択：狭い画面で文字が切れる */
.round-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));max-width:700px;margin:0 auto}
.round-btn .n{font-size:1.1rem}

/* ノッチ・ホームバー */
#screen-rounds{padding-left:calc(22px + env(safe-area-inset-left,0px));padding-right:calc(22px + env(safe-area-inset-right,0px))}
.rounds-header{padding-top:calc(22px + env(safe-area-inset-top,0px))}
.words-chrome{padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:calc(18px + env(safe-area-inset-left,0px));padding-right:calc(18px + env(safe-area-inset-right,0px))}
.page{padding-top:calc(70px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));opacity:1;transform:none}
.page-idx-mark{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.scroll-cue{bottom:calc(16px + env(safe-area-inset-bottom,0px))}

/* ページ全体ではなく中身だけを縮小（scroll-snapの位置ズレ防止） */
.page>.tate-flow{opacity:.28;transform:scale(.92);transition:opacity .5s ease,transform .5s ease}
.page.active>.tate-flow{opacity:1;transform:scale(1)}

/* 縦書き：多段組みを外し、余白・罫線を縦書き用（論理プロパティ）に */
.tate-flow{columns:auto;column-gap:normal;height:min(calc(var(--vh,1vh)*72),560px)}
.tate-headword{margin:0;margin-block-end:14px}
.tate-pos{margin:0;margin-block-end:18px}
.tate-meaning,.tate-block{margin:0;margin-block-end:22px}
.tate-block .tag{margin-bottom:0;padding-bottom:0;border-bottom:0;margin-block-end:8px;padding-block-end:2px;border-block-end:1px solid var(--gold)}
@media (max-height:820px){
  .tate-flow{height:min(calc(var(--vh,1vh)*68),470px)}
  .tate-headword{margin-block-end:10px}
  .tate-meaning,.tate-block{margin-block-end:16px}
  .rounds-header{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .page{padding-top:calc(56px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){
  .chrome-right{gap:8px}
  .progress-label{font-size:.66rem;letter-spacing:.05em}
  .nav-list{padding:7px 9px;letter-spacing:.08em}
}

/* 「視差を減らす」設定で文字が透明のままになる */
@media (prefers-reduced-motion:reduce){
  .title-vertical .ch,.round-btn,.tate-headword .ch,.tate-block{opacity:1 !important;filter:none !important;transform:none !important}
  .tap-hint{opacity:.85 !important}
}

/* 暗記モード */
.nav-list.on{background:var(--shu);border-color:var(--shu);color:#fff}
.reveal-btn{display:none;position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;background:var(--card);border:1px solid var(--shu);color:var(--shu-deep);font-family:inherit;font-weight:700;font-size:.85rem;letter-spacing:.15em;padding:8px 22px;border-radius:3px;cursor:pointer}
.quiz .reveal-btn{display:block}
.quiz .tate-flow{cursor:pointer}
.quiz .page:not(.revealed) .secret{color:transparent !important;background:rgba(74,66,53,.13);border-radius:3px;user-select:none;-webkit-user-select:none}
.quiz .list-chip .li-mean{color:transparent;background:rgba(74,66,53,.13);border-radius:2px}
</style>
<script>
(function(){
  /* ---- データの誤り修正 ---- */
  function fix(w,o){for(const r of ROUNDS){const x=r.words.find(v=>v.w===w);if(x){Object.assign(x,o);return;}}}
  fix('あく',{pos:'動（四段）',ex:{t:'見るにあかぬ心地す。',tr:'見ていて飽きない気持ちがする。'}});
  fix('きこゆ',{expl:'謙譲の補助動詞として非常によく使われ、また『評判になる』の意味でも使われる。'});
  fix('うたてし',{pos:'形／副（うたて）'});
  fix('えんご（修辞法）',{ex:{t:'「露」と「消ゆ」とは縁語なり。',tr:'『露』と『消ゆ』は縁語である。'}});
  fix('じょことば（修辞法）',{ex:{t:'「あしひきの山鳥の尾のしだり尾の」は「長々し」を導く序詞なり。',tr:'『あしひきの山鳥の尾のしだり尾の』は『長々し』を導く序詞である。'}});
  fix('ならふ',{mean:'慣れる・習慣となる／習う・学ぶ',expl:'繰り返すことで身につく意から、『習慣になる』『習う・学ぶ』の意味を表す。'});
  fix('にょうばう',{ex:{t:'にょうばうたちさぶらふ。',tr:'女房たちがお仕えする。'}});
  fix('すさまじ',{ex:{t:'すさまじきもの、昼ほゆる犬。',tr:'興ざめなもの、それは昼に吠える犬。',s:'枕草子（すさまじきもの）'}});

  /* ---- 暗記モード ---- */
  let quiz=false;
  try{quiz=localStorage.getItem('kobun_quiz')==='1';}catch(e){}
  const btn=document.createElement('button');
  btn.className='nav-list';btn.id='toggleQuiz';btn.type='button';btn.textContent='暗記';
  document.querySelector('.chrome-right').insertBefore(btn,document.getElementById('openList'));
  const pagesOf=()=>wordsContainer.querySelectorAll('.page');
  function label(p){const b=p.querySelector('.reveal-btn');if(b)b.textContent=p.classList.contains('revealed')?'隠す':'こたえを見る';}
  function reveal(p){if(!quiz||!p)return;p.classList.toggle('revealed');label(p);}
  function apply(){
    screens.words.classList.toggle('quiz',quiz);
    btn.classList.toggle('on',quiz);
    btn.setAttribute('aria-pressed',String(quiz));
    pagesOf().forEach(p=>{p.classList.remove('revealed');label(p);});
  }
  function enhance(){
    pagesOf().forEach(p=>{
      p.querySelectorAll('.tate-meaning,.tate-block.expl,.tate-block.mne,.ex-trans').forEach(e=>e.classList.add('secret'));
      const b=document.createElement('button');
      b.type='button';b.className='reveal-btn';
      b.addEventListener('click',e=>{e.stopPropagation();reveal(p);});
      p.appendChild(b);
      p.querySelector('.tate-flow').addEventListener('click',()=>reveal(p));
    });
    apply();
  }
  btn.addEventListener('click',()=>{
    quiz=!quiz;
    try{localStorage.setItem('kobun_quiz',quiz?'1':'0');}catch(e){}
    apply();btn.blur();
  });
  const open0=openRound;
  window.openRound=function(id){
    if(document.activeElement)document.activeElement.blur();
    open0(id);enhance();
  };
  /* ページを離れたら「こたえ」を隠し直す */
  window.setupObserver=function(round){
    if(observer)observer.disconnect();
    observer=new IntersectionObserver(es=>{
      es.forEach(en=>{
        const p=en.target;
        if(en.isIntersecting&&en.intersectionRatio>0.55){
          p.classList.add('active');
          updateProgress(round,Number(p.dataset.index));
        }else{
          p.classList.remove('active','revealed');
          label(p);
        }
      });
    },{root:wordsContainer,threshold:[0,0.55,1]});
    pagesOf().forEach(p=>observer.observe(p));
  };

  /* ---- キーボード操作 ---- */
  function go(d){
    const ps=pagesOf();
    const t=ps[Math.max(0,Math.min(ps.length-1,currentIndex+d))];
    if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
  }
  document.addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    const k=e.key,onBtn=document.activeElement&&document.activeElement.tagName==='BUTTON';
    if(screens.title.classList.contains('active')){
      if(k==='Enter'||k===' '){e.preventDefault();showScreen('rounds');}
      return;
    }
    if(screens.rounds.classList.contains('active')){
      if(k==='Escape')showScreen('title');
      return;
    }
    if(listOverlay.classList.contains('open')){if(k==='Escape')closeList();return;}
    if(k==='Escape'){showScreen('rounds');}
    else if(k==='ArrowDown'||k==='ArrowRight'||k==='PageDown'){e.preventDefault();go(1);}
    else if(k==='ArrowUp'||k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(-1);}
    else if((k===' '||k==='Enter')&&!onBtn){e.preventDefault();if(quiz)reveal(pagesOf()[currentIndex]);else go(1);}
    else if(k==='q'||k==='Q'){btn.click();}
  });

  apply();
})();
</script>
